<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MaliFlow | Profile</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../css/pages/profile.css"
    >

</head>

<body>

    <main class="profile-container">

        <header class="page-header">

            <h1>
                Business Profile
            </h1>

            <p>
                Manage your business information
            </p>

        </header>


        <section class="profile-card">

            <form id="profileForm">


                <div class="form-group">

                    <label for="businessName">
                        Business Name
                    </label>

                    <input
                        type="text"
                        id="businessName"
                        placeholder="Enter business name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="ownerName">
                        Owner Name
                    </label>

                    <input
                        type="text"
                        id="ownerName"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter phone number"
                    >

                </div>


                <div class="form-group">

                    <label for="currency">
                        Currency
                    </label>

                    <select id="currency">

                        <option value="KSh">
                            KSh - Kenyan Shilling
                        </option>

                        <option value="USD">
                            USD - US Dollar
                        </option>

                        <option value="EUR">
                            EUR - Euro
                        </option>

                        <option value="GBP">
                            GBP - British Pound
                        </option>

                    </select>

                </div>


                <button
                    type="submit"
                    class="save-btn"
                >
                    Save Profile
                </button>


            </form>

        </section>

    </main>

        </a>

    </nav>


    <script src="../js/profile.js"></script>

</body>

</html>
