<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MaliFlow | Login</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../css/pages/login.css"
    >

</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <div class="logo-section">

                <h1 class="logo">MaliFlow</h1>

                <p class="tagline">
                    Know Your Cash. Grow Your Business.
                </p>

            </div>


            <div class="welcome-section">

                <h2>Welcome Back 👋</h2>

                <p>Sign in to continue.</p>

            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn-primary"
                >
                    Login
                </button>

            </form>


            <div class="footer-links">

                <a href="#">
                    Forgot Password?
                </a>

                <p>
                    Don't have an account?

                    <a href="register.html">
                        Create Account
                    </a>
                </p>

            </div>

        </section>

    </main>


    <script src="../js/login.js"></script>

</body>

</html>
