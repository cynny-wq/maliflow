<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MaliFlow | Dashboard</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../css/pages/dashboard.css"
    >

</head>

<body>

<main class="dashboard-container">

    <!-- Header -->

    <header class="dashboard-header">

        <div>

            <h1>MaliFlow</h1>

            <p id="businessTitle">
                My Business
            </p>

        </div>

        <div class="notification">
            🔔
        </div>

    </header>


    <!-- Welcome -->

    <section class="welcome">

        <h2 id="greeting">
            Good Morning 👋
        </h2>

        <p>
            Here's what's happening with your money.
        </p>

    </section>


    <!-- Quick Actions -->

    <section class="quick-actions">

        <button
            class="action-btn income-btn"
            onclick="window.location.href='cash.html'"
        >
            + Money In
        </button>


        <button
            class="action-btn expense-btn"
            onclick="window.location.href='cash.html'"
        >
            - Money Out
        </button>

    </section>


    <!-- Statistics -->

    <section class="stats">

        <div class="stat-card income">

            <p>Cash In</p>

            <h2 id="cashIn">
                KSh 0
            </h2>

        </div>


        <div class="stat-card expense">

            <p>Cash Out</p>

            <h2 id="cashOut">
                KSh 0
            </h2>

        </div>


        <div class="stat-card balance">

            <p>Balance</p>

            <h2 id="balance">
                KSh 0
            </h2>

        </div>


        <div class="stat-card debt">

            <p>Customer Debt</p>

            <h2 id="customerDebt">
                KSh 0
            </h2>

        </div>

    </section>


    <!-- Recent Transactions -->

    <section class="transactions">

        <h2>
            Recent Transactions
        </h2>

        <div id="transactionList">

            <p class="empty">
                Loading transactions...
            </p>

        </div>

    </section>

</main>

<!-- Edit Transaction Modal -->

<div id="editModal" class="edit-modal">

    <div class="edit-modal-content">

        <div class="edit-modal-header">

            <h2>Edit Transaction</h2>

            <button
                type="button"
                class="close-edit"
                onclick="closeEditModal()">
                ×
            </button>

        </div>


        <form id="editForm">

            <div class="edit-form-group">

                <label>Transaction Type</label>

                <div class="edit-type-buttons">

                    <button
                        type="button"
                        id="editIncomeBtn"
                        class="edit-type-btn active"
                        onclick="setEditType('income')">
                        + Money In
                    </button>

                    <button
                        type="button"
                        id="editExpenseBtn"
                        class="edit-type-btn"
                        onclick="setEditType('expense')">
                        - Money Out
                    </button>

                </div>

            </div>


            <div class="edit-form-group">

                <label for="editAmount">
                    Amount
                </label>

                <input
                    type="number"
                    id="editAmount"
                    min="0"
                    required
                >

            </div>


            <div class="edit-form-group">

                <label for="editCategory">
                    Category
                </label>

                <input
                    type="text"
                    id="editCategory"
                    required
                >

            </div>


            <div class="edit-form-group">

                <label for="editName">
                    Name
                </label>

                <input
                    type="text"
                    id="editName"
                >

            </div>


            <div class="edit-form-group">

                <label for="editNotes">
                    Notes
                </label>

                <textarea
                    id="editNotes">
                </textarea>

            </div>


            <div class="edit-modal-actions">

                <button
                    type="button"
                    class="cancel-edit-btn"
                    onclick="closeEditModal()">
                    Cancel
                </button>

                <button
                    type="submit"
                    class="save-edit-btn">
                    Save Changes
                </button>

            </div>

        </form>

    </div>

</div>
<!-- Bottom Navigation -->

<nav class="bottom-nav">

    <a href="dashboard.html">
        🏠
        <br>
        Home
    </a>

    <a href="cash.html">
        💰
        <br>
        Cash
    </a>

    <a href="customers.html">
        👥
        <br>
        Customers
    </a>

    <a href="profile.html">
        ⚙️
        <br>
        Profile
    </a>

    <a href="transactions.html">
        📊
        <br>
        Transactions
    </a>

</nav>


<script src="../js/dashboard.js"></script>

</body>

</html>
